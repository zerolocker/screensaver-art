name: ScreensaverArt

options:
  bundleIdPrefix: com.livingart.screensaver.app
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Ad-hoc signing; the release build is re-signed by electron-builder's hooks.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # ARCHS_STANDARD is arm64-only on this Xcode, so list both.
    ARCHS: "arm64 x86_64"
  configs:
    # Debug: host arch only.
    Debug:
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      ONLY_ACTIVE_ARCH: "NO"

targets:
  ScreensaverArtExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ScreensaverArtExtension
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_NAME: ScreensaverArtExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.livingart.screensaver.app.Extension
        PRODUCT_MODULE_NAME: ScreensaverArtExtension
        INFOPLIST_FILE: ScreensaverArtExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: ScreensaverArtExtension/ScreensaverArtExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: ScreensaverArtExtension/ScreensaverArtExtension-Bridging-Header.h

  DevHost:
    type: application
    platform: macOS
    sources:
      - path: DevHost
    dependencies:
      - target: ScreensaverArtExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: DevHost
        # The Electron app's bundle id, which the extension's id must extend.
        PRODUCT_BUNDLE_IDENTIFIER: com.livingart.screensaver.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Living Art Screensaver"
        CODE_SIGN_ENTITLEMENTS: DevHost/DevHost.entitlements
    postBuildScripts:
      # Debug only: Release builds go into the Electron app, which registers its
      # own copy, and pluginkit allows one location.
      - name: Register appex with pluginkit (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            find "$CODESIGNING_FOLDER_PATH" -name '*.appex' -exec /usr/bin/pluginkit -a {} \;
          fi
